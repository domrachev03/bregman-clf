[workspace]
name = "bregman-clf"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
pip = "*"
pinocchio = "==4.1.0"
casadi = "==3.7.2"
daqp = "==0.10.1"
numpy = "==2.4.6"
scipy = "==1.18.0"
pyyaml = "*"
matplotlib-base = "==3.11.2"
pandas = "==3.0.6"
pyarrow = "==25.0.0"

[pypi-dependencies]
mujoco = "==3.14.0"
robot_descriptions = "==3.2.0"
bregman-clf = { path = ".", editable = true }

[tasks]
# The stored results were produced with the PyPI wheels of numpy and scipy (bundled OpenBLAS 0.3.31),
# which shadowed the conda-forge builds. This task puts the same wheels on PYTHONPATH (see below);
# without it the conda-forge builds are used and individual episodes differ in the last digits.
reference-wheels = "python -m pip install --no-deps --upgrade --target .reference-wheels numpy==2.4.6 scipy==1.18.0"

[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/.reference-wheels"
PYTHONNOUSERSITE = "1"
OMP_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
MUJOCO_GL = "egl"
